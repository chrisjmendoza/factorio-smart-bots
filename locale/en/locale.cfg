[mod-name]
SmartBots=Smarter Bot Charging

[mod-description]
SmartBots=Roboports get more charging pads, and lend their buffered energy to robots still queued for one. Bots spend their time flying instead of waiting in line.

[mod-setting-name]
smartbots-charging-stations=Charging pads per roboport
smartbots-charging-power=Charging power multiplier
smartbots-robot-battery=Robot battery size multiplier
smartbots-robot-efficiency=Robot flight energy multiplier
smartbots-enable-overflow=Roboports lend energy to queued robots
smartbots-overflow-power=Lending power per robot (MW)
smartbots-roboport-reserve=Roboport energy reserve
smartbots-borrow-from-neighbours=Borrow from neighbouring roboports
smartbots-robots-per-cycle=Robots served per cycle
smartbots-show-queues=Show charge queue depth

[mod-setting-description]
smartbots-charging-stations=How many robots a roboport can charge at once. Vanilla is 4, so the fifth robot to arrive waits however much energy the roboport is holding.
smartbots-charging-power=Scales the power delivered to each charging pad, so a charge finishes sooner. 1 leaves it at the vanilla rate.
smartbots-robot-battery=Scales robot battery size. A bigger battery means fewer trips to a roboport, which is the cheapest fix of all — the charge that never happens costs nothing.
smartbots-robot-efficiency=Scales how much energy a robot spends flying. Below 1 makes robots thriftier and stretches every charge further.
smartbots-enable-overflow=When a roboport's pads are full, it pushes energy straight into the robots waiting behind them. Turn this off to leave charging entirely to the base game.
smartbots-overflow-power=How fast a queued robot is topped up. Higher clears queues faster and draws harder on roboport buffers, and through them on your power grid.
smartbots-roboport-reserve=The fraction of its energy buffer a roboport keeps for itself. Roboports run their pads and doors off the same buffer and stop working if they empty it, so leave some headroom here.
smartbots-borrow-from-neighbours=A congested roboport that has hit its reserve may draw on the buffers of roboports it connects to, spreading the load instead of stalling.
smartbots-robots-per-cycle=Work limit per half-second pass. Serving resumes where it left off, so this caps the UPS cost on a large base rather than skipping queues.
smartbots-show-queues=Draws the number of robots waiting to charge above each congested roboport. Works whether or not lending is enabled, so you can see what the mod is doing — or what it would do.
